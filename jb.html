<!DOCTYPE html>
<html lang="vi" manifest="cache.appcache">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Jailbreak PS4 - Kenny Yoon</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #121820;
      --item-bg: rgba(255, 255, 255, 0.03);
      --item-border: rgba(255, 255, 255, 0.08);
      --accent-color: #0070d1;
      --text-color: #e6edf3;
      --text-secondary: #8b949e;
      --error-color: #f85149;
      --success-color: #3fb950;
      --warning-color: #d29922;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--item-border);
      border-radius: 12px;
      padding: 35px 30px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Tiêu đề chính & Tiêu đề phụ đồng bộ */
    #brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .main-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    hr.divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 112, 209, 0.5), transparent);
      margin-bottom: 25px;
    }

    /* Con xoay Spinner */
    #spin {
      width: 46px;
      height: 46px;
      margin: 20px auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Thông báo lỗi khi thất bại */
    #msg {
      font-size: 16px;
      font-weight: 600;
      color: var(--error-color);
      margin-top: 15px;
      display: none;
    }

    #wrap {
      padding: 0;
    }

    #state, #out {
      display: none;
    }

    /* Trạng thái khi hoàn tất hoặc thất bại do jb.js điều khiển */
    body.done #spin,
    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;
    }

    /* Chế độ xem Nhật ký (?log=1) */
    body.log {
      overflow: auto;
    }

    body.log #spin,
    body.log #msg {
      display: none;
    }

    body.log .container {
      max-width: 900px;
      text-align: left;
    }

    body.log #state {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    body.log #out {
      display: block;
      white-space: pre-wrap;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      background: rgba(11, 14, 20, 0.95);
      border: 1px solid var(--item-border);
      border-radius: 8px;
      padding: 15px;
      max-height: 60vh;
      overflow-y: auto;
      color: #c9d1d9;
    }

    /* Màu sắc trạng thái trong log */
    .ok, .safe { color: var(--success-color); }
    .bad, .danger { color: var(--error-color); }
    .warn { color: var(--warning-color); }
    code { color: #79c0ff; }
  </style>
</head>

<body>

  <div class="container">
    <div id="brand">
      <div class="main-title">Auto Jailbreak PS4 - Kenny Yoon</div>
      <div class="sub-title">Hỗ trợ fw 13.02 - 13.52</div>
    </div>

    <hr class="divider">

    <div id="spin"></div>
    <div id="msg">Vui lòng khởi động lại máy (Console)</div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </div>

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>

</html>
